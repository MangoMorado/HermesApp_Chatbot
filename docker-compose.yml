services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ingenius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en tu .env}
      POSTGRES_DB: ${POSTGRES_DB:-ingenius}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ingenius} -d ${POSTGRES_DB:-ingenius}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ingenius}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ingenius}?schema=public
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      OIDC_ISSUER: ${OIDC_ISSUER:?define OIDC_ISSUER en tu .env}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?define OIDC_AUDIENCE en tu .env}
      OIDC_TENANT_CLAIM: ${OIDC_TENANT_CLAIM:-tenant_id}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      OIDC_ROLE_MAP: ${OIDC_ROLE_MAP:-}
      OIDC_CLOCK_TOLERANCE_SECONDS: ${OIDC_CLOCK_TOLERANCE_SECONDS:-30}
      OIDC_LOGOUT_AUDIENCES: ${OIDC_LOGOUT_AUDIENCES:-}
      OIDC_MAX_TOKEN_LIFETIME_SECONDS: ${OIDC_MAX_TOKEN_LIFETIME_SECONDS:-300}
      OIDC_HTTP_TIMEOUT_MS: ${OIDC_HTTP_TIMEOUT_MS:-5000}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?define CREDENTIALS_ENCRYPTION_KEY en tu .env}
      HERMES_SIM_SERVICE_CLIENTS: ${HERMES_SIM_SERVICE_CLIENTS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      FHIR_BASE_URL: ${FHIR_BASE_URL:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:3001}
      PUBLIC_OIDC_ISSUER: ${PUBLIC_OIDC_ISSUER:-}
      PUBLIC_OIDC_CLIENT_ID: ${PUBLIC_OIDC_CLIENT_ID:-chatbot-reference-ui}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
