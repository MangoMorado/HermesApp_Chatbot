services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ingenius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ingenius}
      POSTGRES_DB: ${POSTGRES_DB:-ingenius}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ingenius} -d ${POSTGRES_DB:-ingenius}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ingenius}:${POSTGRES_PASSWORD:-ingenius}@postgres:5432/${POSTGRES_DB:-ingenius}?schema=public
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en tu .env}
      JWT_ISSUER: ${JWT_ISSUER:-chatbot-ingenius-360}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-chatbot-ingenius-360}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
