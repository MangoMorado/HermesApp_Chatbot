sonar.projectKey=MangoMorado_HermesApp_Chatbot_832761dd-ed68-4d82-863b-5167212fc35c

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.test.inclusions=**/*.test.ts

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Fuera del alcance del análisis: demos interactive y skills de agentes
sonar.exclusions=interactive/**,.agents/skills/**,.claude/skills/**,.github/skills/**,**/node_modules/**,**/.next/**,**/coverage/**

# Fuera del denominador de cobertura:
# - clientes orval (no se editan a mano)
# - UI presentacional y hooks React (sin RTL)
# - rutas HTTP, composition root y adaptadores Prisma (cubiertos por test:db)
sonar.coverage.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,frontend/src/api/**,frontend/src/sim/**,frontend/src/platform/**,frontend/src/widget/api/**,frontend/src/app/**,frontend/src/components/**/*.tsx,frontend/src/widget/**/*.tsx,frontend/src/lib/use-*.ts,frontend/src/widget/use-*.ts,frontend/src/components/**/use-*.ts,backend/src/app/**,backend/src/composition/**,backend/src/composition-root.ts,backend/src/**/infrastructure/prisma*,backend/src/modules/shared/infrastructure/prisma-client.ts,backend/src/http/openapi*.ts
